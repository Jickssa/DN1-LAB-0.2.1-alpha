title: Idea / Idée
body:
  - type: markdown
    attributes:
      value: "Discuss the sonic goal, DSP approach and references. An idea is not yet a validated engine. / Décrivez l'objectif sonore, l'approche DSP et les références. Une idée n'est pas encore un moteur validé."
  - type: textarea
    id: concept
    attributes:
      label: Concept / Concept
      description: What should this make possible? / Que doit permettre cette idée ?
    validations:
      required: true
  - type: textarea
    id: sonic_examples
    attributes:
      label: Sonic references / Références sonores
      description: Instruments, recordings, synthesis methods or non-confidential audio references.
  - type: textarea
    id: design
    attributes:
      label: Proposed approach / Approche proposée
      description: Algorithm, controls, modulation and expected behavior.
  - type: textarea
    id: constraints
    attributes:
      label: Constraints / Contraintes
      description: Target OS, SDK, CPU, per-voice memory, sample rate and polyphony.
  - type: textarea
    id: references
    attributes:
      label: Prior art and sources / Antériorité et sources
      description: Papers, patents, plugins, instruments or code related to the proposal.

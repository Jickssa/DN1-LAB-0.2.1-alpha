name: DN1-LAB repository checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-and-site:
    name: Catalogue and static-site validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalogue against SDK sources
        run: python3 tools/validate_catalogue.py
      - name: Validate static-site references
        run: python3 tools/validate_site.py
      - name: Compile Python validators
        run: python3 -m compileall -q tools
      - name: Check guarded build script syntax
        run: sh -n scripts/build_digitone_alpha.sh
      - name: Parse all checked-in JSON manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('.').rglob('*.json'))
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'PASS {path}')
          print(f'Validated {len(files)} JSON files')
          PY

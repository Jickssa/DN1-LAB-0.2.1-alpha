name: Feature or machine proposal / Fonction ou machine
description: Propose a capability, DSP engine or improvement.
title: "[PROPOSAL] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "A proposal is not a promise of implementation. Include relevant prior art and resource constraints."
  - type: textarea
    id: goal
    attributes:
      label: Sonic goal / Objectif sonore
      description: What new sound-design capability should become possible?
    validations:
      required: true
  - type: textarea
    id: difference
    attributes:
      label: Difference from existing engines / Différence avec le catalogue
      description: Why do KARST, MORPHANT, TESSERA or the six prototypes not already cover it?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Algorithm and controls / Algorithme et contrôles
      description: Proposed synthesis method, parameters, ranges, defaults and modulation behavior.
  - type: textarea
    id: constraints
    attributes:
      label: Target and resources / Cible et ressources
      description: Hardware, OS, SDK/API, per-voice state, CPU worst case, aliasing and voice count.
  - type: textarea
    id: prior_art
    attributes:
      label: Prior art / Antériorité
      description: Related instruments, algorithms, papers, patents, plugins or other work.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / Critères d'acceptation
      description: What tests and listening comparisons would demonstrate success?
